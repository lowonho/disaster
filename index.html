<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202623">
  <meta name="description" content="화재·침수·지진 현장에서 주변 상황을 읽고 대피 방법을 선택하는 턴제 재난 시뮬레이터.">
  <title>재난 시뮬레이터</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/field.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body data-scenario="fire">
  <header class="topbar">
    <div class="shell header-inner">
      <div class="brand"><span class="brand-mark"><i data-icon="brand"></i></span><span>재난 시뮬레이터</span></div>
      <div class="utilities">
        <button id="game-menu" type="button" class="utility game-menu" aria-label="게임 메뉴 · 저장 및 불러오기" hidden><i data-icon="menu"></i><span>메뉴</span></button>
        <button id="help" type="button" class="utility" aria-label="플레이 방법"><i data-icon="help"></i><span>플레이 방법</span></button>
        <span class="header-divider" aria-hidden="true"></span>
        <button id="sound" type="button" class="utility sound-control" aria-label="효과음" aria-pressed="false" title="효과음 켜기"><i data-icon="muted"></i></button>
      </div>
    </div>
  </header>
  <main id="title-screen" class="shell title-shell" aria-labelledby="title-name">
    <section class="title-card">
      <div class="title-scene">
        <img src="assets/scenes/fire-home/a.png" alt="" fetchpriority="high">
        <div class="title-copy">
          <h1 id="title-name">재난<br>시뮬레이터</h1>
          <p>문밖에 연기가 찼습니다. 나갈 수 있을까요?<br>현장을 살피고 다음 행동을 선택하세요.</p>
        </div>
      </div>
      <nav class="title-actions" aria-label="시작 메뉴">
        <div id="play-buttons" class="play-buttons">
          <button id="new-game" class="title-action primary" type="button"><i data-icon="play"></i><span>게임 시작</span><i class="forward" data-icon="next"></i></button>
          <button id="continue-game" class="title-action" type="button" disabled><i data-icon="log"></i><span><strong id="continue-label">이어하기</strong><small id="continue-detail">저장된 진행 없음</small></span><i class="forward" data-icon="next"></i></button>
        </div>
        <button id="title-load" class="title-link" type="button"><i data-icon="folder"></i>세이브 파일 불러오기</button>
        <button id="title-settings" class="title-link" type="button"><i data-icon="settings"></i>환경 설정</button>
      </nav>
    </section>
  </main>
  <main id="game-screen" class="shell main-shell" hidden>
    <div class="toolbar">
      <nav class="scenario-nav" aria-label="시나리오 선택">
        <span class="nav-label" aria-hidden="true">시나리오</span>
        <div class="scenario-tabs">
          <button type="button" data-scenario-id="fire" aria-pressed="true"><i data-icon="flame"></i>화재</button>
          <button type="button" data-scenario-id="flood" aria-pressed="false"><i data-icon="water"></i>홍수</button>
          <button type="button" data-scenario-id="quake" aria-pressed="false"><i data-icon="quake"></i>지진</button>
        </div>
      </nav>
      <nav class="venue-nav" aria-label="장소 선택">
        <span class="nav-label" aria-hidden="true">장소</span>
        <div class="venue-tabs">
          <button type="button" data-venue="home" aria-pressed="true"><span>집</span><small>쉬움</small></button>
          <button type="button" data-venue="work" aria-pressed="false"><span>직장</span><small>보통</small></button>
          <button type="button" data-venue="travel" aria-pressed="false"><span>여행지</span><small>어려움</small></button>
        </div>
      </nav>
      <div class="toolbar-tools">
        <button type="button" id="difficulty" class="toolbar-button" aria-label="이 맵의 난이도 설정"><i data-icon="settings"></i><span>난이도 설정</span></button>
        <button type="button" id="restart" class="toolbar-button" aria-label="현재 맵 처음부터 시작"><i data-icon="restart"></i><span>처음부터</span></button>
      </div>
    </div>
    <div class="play-grid">
      <div class="main-column">
        <article class="scene-panel panel" id="scene-panel" tabindex="-1" aria-labelledby="current-place" aria-describedby="scene-description">
          <div class="hero" id="scene-view">
            <img id="scene-image" alt="" fetchpriority="high">
            <div class="hero-shade" aria-hidden="true"></div>
            <div class="hero-hud">
              <span class="alert-tag"><i data-icon="alert"></i><span id="alert-label">화재 경보</span></span>
              <div class="turn" id="turn-counter"><span aria-hidden="true" lang="en">TURN</span><b id="turn-number">01</b></div>
            </div>
            <div class="hero-caption">
              <div class="setting"><i data-icon="pin"></i><span id="scenario-title"></span></div>
              <h1 id="current-place"></h1>
            </div>
          </div>
          <div class="briefing" id="briefing">
            <h2 id="scene-title"></h2>
            <p id="scene-description"></p>
            <div class="mission-goal"><i data-icon="flag"></i><span id="goal-label">최종 목표</span><strong id="objective"></strong></div>
          </div>
        </article>
        <section class="choices-section" aria-labelledby="choices-title">
          <div class="section-heading"><h2 id="choices-title" tabindex="-1"><i data-icon="cursor"></i><span>현장 행동</span></h2><span id="choice-note" class="minor-label"><i data-icon="clock"></i>선택하는 동안 시간 정지</span></div>
          <div id="feedback" class="feedback" hidden></div>
          <nav id="field-tabs" class="field-tabs" aria-label="현장 메뉴">
            <button type="button" data-view="field" aria-pressed="true"><i data-icon="eye"></i>대응 행동</button>
            <button type="button" data-view="travel" aria-pressed="false"><i data-icon="route"></i>대피 경로</button>
            <button type="button" data-view="guide" aria-pressed="false"><i data-icon="log"></i>행동요령</button>
          </nav>
          <div id="field-context"></div>
          <div id="actions" class="actions"></div>
          <div id="outcome" class="outcome panel" hidden></div>
        </section>
      </div>
      <aside class="rail" aria-label="대피 정보">
        <section class="vitals" aria-labelledby="vitals-heading">
          <div class="card-heading"><h2 id="vitals-heading"><i data-icon="pulse"></i>현장 상황</h2><span id="status-label" class="status-word"></span></div>
          <dl class="situation-facts">
            <div><dt>주변 징후</dt><dd id="scene-signal"></dd></div>
            <div><dt>신고 상황</dt><dd id="report-state"></dd></div>
          </dl>
          <div class="hazard-note" id="hazard-note"></div>
        </section>
        <section class="route-panel panel" aria-labelledby="route-heading">
          <div class="card-heading"><h2 id="route-heading" tabindex="-1"><i data-icon="route"></i>지역 지도</h2><span class="route-count">확인한 장소 <b id="stage-count">1</b>곳</span></div>
          <p id="map-origin" class="map-origin"></p>
          <div class="route-map" id="route-map" role="group" aria-label="지역을 선택해 대피 표지와 이동 경로 확인">
            <canvas id="route-lines" aria-hidden="true"></canvas>
            <div id="map-points"></div>
          </div>
          <div id="map-detail" class="map-detail"></div>
          <div class="goal"><i data-icon="route"></i><div><span id="step-label">지금 할 일</span><p id="step-objective"></p></div></div>
        </section>
        <section class="log-panel panel" aria-labelledby="log-heading">
          <div class="card-heading"><h2 id="log-heading"><i data-icon="log"></i>행동 기록</h2><button type="button" id="show-log" class="text-button">전체 보기</button></div>
          <ol id="recent-log" class="recent-log"></ol>
        </section>
      </aside>
    </div>
    <footer class="save-status" id="save-status"><i data-icon="save"></i><span>이 기기에 자동 저장</span><button id="quick-save" type="button" class="text-button">세이브 파일 저장</button></footer>
    <p id="export-status" class="export-status" role="status"></p>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="close-button" aria-label="닫기"><i data-icon="close"></i></button></div>
    <div id="dialog-content"></div>
  </dialog>
  <div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>이 게임을 플레이하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
  <script src="js/data/regions.js"></script>
  <script src="js/data/maps.js"></script>
  <script src="js/data/scenes.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/legacy/scenarios-v2.js"></script>
  <script src="js/legacy/engine-v2.js"></script>
  <script src="js/legacy/supplies-v4.js"></script>
  <script src="js/legacy/maps-v4.js"></script>
  <script src="js/legacy/knowledge-v4.js"></script>
  <script src="js/legacy/field-v4.js"></script>
  <script src="js/data/guidance.js"></script>
  <script src="js/response.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/save-file.js"></script>
  <script src="js/ui/art.js"></script>
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/map.js"></script>
  <script src="js/ui/field-panel.js"></script>
  <script src="js/ui/difficulty.js"></script>
  <script src="js/ui/start-menu.js"></script>
  <script src="js/ui/save-dialog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
